# Postgres+pgvector desechable para probar la memoria semántica contra una base REAL.
# NO es el de producción: puerto 15433 y sin volumen (se borra al bajarlo).
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
services:
  pgvector-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: asistente
      POSTGRES_PASSWORD: asistente
      POSTGRES_DB: asistente
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistente"]
      interval: 3s
      timeout: 3s
      retries: 15
